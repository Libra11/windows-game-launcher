[package]
name = "local_achievement_launcher"
version = "0.2.8"
description = "Windows game launcher with local achievements"
edition = "2021"

[lib]
name = "local_achievement_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
semver = "1"
minisign-verify = "0.2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "system-proxy", "socks"], default-features = false }
tokio = { version = "1", features = ["time", "sync", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
steamlocate = "2.1.1"
roxmltree = "0.20"
scraper = "0.24"

[target."cfg(windows)".dependencies]
tauri-plugin-updater = "=2.13.2"
# 更新插件使用 reqwest 0.13，单独启用自定义 SOCKS5 代理。
updater-http = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
