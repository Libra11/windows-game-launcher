[package]
name = "youji-save-archive"
version = "0.1.0"
edition = "2021"

[dependencies]
youji-cloud-protocol = { path = "../cloud-protocol" }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }

[features]
http = ["dep:reqwest", "dep:tokio"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "stream"]
optional = true

[dependencies.tokio]
version = "1"
features = ["fs", "io-util"]
optional = true
