# 河源 ECS 上的站点反向代理（系统 nginx，非容器 Caddy）。
# 实际路径：/etc/nginx/conf.d/libra-diary.conf
# 修改后必须 nginx -t 通过再 nginx -s reload；其他站点的 conf 不要动。
# client_max_body_size 必须覆盖导入预览请求：客户端一次上传整个资料库（含成就定义缓存），
# 曾因保留默认 1m 导致大库用户在预览时收到 nginx 413 HTML 页面，客户端显示「云端响应格式错误」。
# 独立站点；Certbot 使用 /opt/apps/libra-diary/acme 完成 HTTP-01 验证。
server {
    listen 80;
    server_name game.penlibra.xin;
    location ^~ /.well-known/acme-challenge/ { root /opt/apps/libra-diary/acme; }
    location / { return 301 https://game.penlibra.xin$request_uri; }
}
server {
    listen 443 ssl;
    server_name game.penlibra.xin;
    ssl_certificate /etc/letsencrypt/live/game.penlibra.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.penlibra.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/libra-diary-access.log;
    error_log /var/log/nginx/libra-diary-error.log;
    # 存档通过预签名地址直传 OSS；但导入预览会一次上传整个资料库（含定义缓存），故放宽到 64m。
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 大资料库的导入计划计算可能较慢，放宽读取超时。
        proxy_read_timeout 120s;
    }
}