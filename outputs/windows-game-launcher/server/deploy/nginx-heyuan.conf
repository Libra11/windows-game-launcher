# 独立站点；Certbot 使用 /opt/apps/libra-diary/acme 完成 HTTP-01 验证。
server {
    listen 80;
    server_name game.penlibra.xin;
    location ^~ /.well-known/acme-challenge/ { root /opt/apps/libra-diary/acme; }
    location / { return 301 https://game.penlibra.xin$request_uri; }
}
server {
    listen 443 ssl;
    server_name game.penlibra.xin;
    ssl_certificate /etc/letsencrypt/live/game.penlibra.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.penlibra.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/libra-diary-access.log;
    error_log /var/log/nginx/libra-diary-error.log;
    # 存档通过预签名地址直传 OSS；API 只接收元数据。
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
