[package]
name = "youji-cloud-server"
version = "0.1.0"
edition = "2021"

[dependencies]
youji-cloud-protocol = { path = "../cloud-protocol" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
url = "2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

roxmltree = "0.20"
tokio-util = { version = "0.7", features = ["io"] }
youji-save-archive = { path = "../save-archive" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

