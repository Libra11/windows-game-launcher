name: Windows Release

on:
  push:
    branches: [main]
    paths:
      - outputs/windows-game-launcher/package.json
      - outputs/windows-game-launcher/package-lock.json
      - outputs/windows-game-launcher/src-tauri/Cargo.toml
      - outputs/windows-game-launcher/src-tauri/Cargo.lock
      - outputs/windows-game-launcher/src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: windows-release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 检测 main 的版本号变更
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: pwsh
        run: ./.github/scripts/detect-release-version.ps1 -Before $env:BEFORE_SHA

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: outputs/windows-game-launcher
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 校验发布版本
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: ../../.github/scripts/check-release-version.ps1 -Tag $env:RELEASE_TAG

      - name: 检查签名配置和中文发布说明
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw '请先配置更新签名私钥和密码的 GitHub Actions Secrets。'
          }
          . ../../.github/scripts/prepare-update-release.ps1
          $version = (Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $null = Read-ReleaseNotes '.' $version

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: outputs/windows-game-launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: outputs/windows-game-launcher/src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Windows x64 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --ci -- --locked

      - name: 准备签名更新包和更新清单
        run: |
          ../../.github/scripts/prepare-update-release.ps1 -ProjectDirectory '.' `
            -BundleDirectory 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' `
            -OutputDirectory 'update-release' -Repository '${{ github.repository }}'

      - name: 上传签名更新产物
        uses: actions/upload-artifact@v7
        with:
          name: youji-windows-x64
          path: outputs/windows-game-launcher/update-release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: youji-windows-x64
          path: release

      - name: 上传完整产物后发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: bash .github/scripts/publish-update-release.sh release
